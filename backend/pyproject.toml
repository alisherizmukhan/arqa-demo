[project]
name = "driver-diary-backend"
version = "0.1.0"
description = "Driver Shift Diary API: trips per day, daily summary, idempotent trip creation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF",
    "ASYNC", "S", "PT", "RET", "ARG", "PL", "TRY", "ERA", "PIE", "PERF",
]
ignore = [
    "TRY003",   # long messages in exceptions are fine for domain errors
    "PLR2004",  # magic values in comparisons are ok in tests and domain rules
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests use made-up passwords and hashes on purpose (S105-S107).
"tests/**" = ["S101", "PLR2004", "ARG001", "S105", "S106", "S107"]
# Dev scripts: console output and non-crypto randomness are intended.
"scripts/**" = ["T201", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs code inside greenlets.
concurrency = ["greenlet", "thread"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
