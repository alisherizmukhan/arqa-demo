name: design_kit
description: Design tokens, themes and components for Driver Shift Diary.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # Material icons font for the kit's own tests (the kit is the root there).
  uses-material-design: true
  fonts:
    # Manrope (DESIGN.md §2.2): static 500/600/700/800 instances of the
    # variable font, SIL OFL 1.1 (no Reserved Font Name) — fonts/Manrope-OFL.txt.
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope-ExtraBold.ttf
          weight: 800
    # IBM Plex Sans, unmodified, SIL OFL 1.1 — fonts/IBMPlexSans-OFL.txt.
    # Glyph fallback only: Manrope has no `₸` (U+20B8) and no U+202F.
    - family: IBMPlexSans
      fonts:
        - asset: fonts/IBMPlexSans-Variable.ttf
