name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driver_diary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d driver_diary_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driver_diary_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests (with coverage)
        run: uv run pytest --cov --cov-fail-under=95

  design_kit:
    name: Design kit (analyze + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies (workspace)
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --fatal-infos packages/design_kit
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages/design_kit
      - name: Tests
        working-directory: packages/design_kit
        run: flutter test
      - name: Showcase tests
        working-directory: packages/design_kit/example
        run: flutter test

  mobile:
    name: Mobile app (analyze + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies (workspace)
        run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date
        working-directory: apps/mobile
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            echo "::error::Generated code is stale: run build_runner and commit the result"
            exit 1
          fi
      - name: No raw colors or text styles in the app (DESIGN.md §7)
        run: |
          if grep -RnE 'Color\(0x|\bColors\.|TextStyle\(' apps/mobile/lib; then
            echo "::error::Use design kit tokens (context.dkColors / context.dkText) in apps/mobile"
            exit 1
          fi
      - name: No Cyrillic literals outside the localizations (texts live in ARB files)
        env:
          LC_ALL: C.UTF-8
        run: |
          hits=$(grep -RnP '[\x{0400}-\x{04FF}]' apps/mobile/lib packages/design_kit/lib --include='*.dart' \
            | grep -v '^apps/mobile/lib/l10n/gen/' \
            | grep -vP '^[^:]+:\d+:\s*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Move user-visible text to apps/mobile/lib/l10n/app_ru.arb / app_kk.arb (the kit takes texts as parameters)"
            exit 1
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos apps/mobile
      - name: Format
        run: dart format --output=none --set-exit-if-changed apps/mobile/lib apps/mobile/test
      - name: Tests
        working-directory: apps/mobile
        run: flutter test
      - name: Screenshots (every state renders, no two states look the same)
        working-directory: apps/mobile
        run: SCREENSHOTS_DIR=build/screens flutter test test/screens/screenshots_test.dart
